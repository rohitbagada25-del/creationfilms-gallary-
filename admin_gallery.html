<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ gallery.name }} — Studio Admin</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="admin-wrap">
  <p><a href="{{ url_for('admin_home') }}" style="color:var(--muted); font-size:0.85rem;">&larr; All galleries</a></p>
  <div class="display">{{ gallery.name }}</div>
  <p style="color:var(--muted); margin-bottom:24px;">
    Share this with your client: <code>{{ request.host_url }}gallery/{{ slug }}</code> &middot; password: <strong>{{ gallery.password }}</strong>
  </p>

  <div class="upload-drop" id="dropzone">
    Click or drop photos here to upload to this gallery
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
  </div>
  <div class="progress" id="progress"></div>

  <div class="thumb-grid" id="thumbGrid">
    {% for p in gallery.photos %}
      <div class="thumb" data-id="{{ p.id }}">
        <img src="{{ url_for('photo_proxy', slug=slug, photo_id=p.id) }}" loading="lazy">
        <button class="del" onclick="deletePhoto('{{ p.id }}')">&times;</button>
      </div>
    {% endfor %}
  </div>
</div>

<script>
const slug = {{ slug|tojson }};
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const progress = document.getElementById('progress');
const thumbGrid = document.getElementById('thumbGrid');

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  uploadFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => uploadFiles(fileInput.files));

async function uploadFiles(fileList) {
  const files = Array.from(fileList);
  if (!files.length) return;

  const total = files.length;
  let uploaded = 0;
  let failed = 0;
  const startTime = Date.now();

  progress.textContent = `Uploading 0 of ${total}... (0s)`;

  const timer = setInterval(() => {
    const secs = Math.floor((Date.now() - startTime) / 1000);
    progress.textContent = `Uploading ${uploaded} of ${total}... (${secs}s)`;
  }, 500);

  for (const f of files) {
    const formData = new FormData();
    formData.append('photos', f);
    try {
      const res = await fetch(`/admin/gallery/${slug}/upload`, { method: 'POST', body: formData });
      const data = await res.json();
      if (data.error) {
        failed++;
      } else {
        uploaded++;
        if (data.photos_meta && data.photos_meta.length) {
          addThumb(data.photos_meta[0]);
        }
      }
    } catch (err) {
      failed++;
    }
    const secs = Math.floor((Date.now() - startTime) / 1000);
    progress.textContent = `Uploading ${uploaded} of ${total}... (${secs}s)`;
  }

  clearInterval(timer);
  const totalSecs = Math.floor((Date.now() - startTime) / 1000);
  if (failed) {
    progress.textContent = `Done — ${uploaded} uploaded, ${failed} failed. (${totalSecs}s)`;
  } else {
    progress.textContent = `Done — ${uploaded} of ${total} photos uploaded in ${totalSecs}s.`;
  }
}

function addThumb(photo) {
  const div = document.createElement('div');
  div.className = 'thumb';
  div.dataset.id = photo.id;
  div.innerHTML = `
    <img src="${photo.thumb_url}" loading="lazy">
    <button class="del" onclick="deletePhoto('${photo.id}')">&times;</button>
  `;
  thumbGrid.prepend(div);
}

async function deletePhoto(id) {
  if (!confirm('Remove this photo from the gallery?')) return;
  const res = await fetch(`/admin/gallery/${slug}/photo/${id}/delete`, { method: 'POST' });
  if (res.ok) {
    document.querySelector(`.thumb[data-id="${id}"]`).remove();
  }
}
</script>
</body>
</html>
