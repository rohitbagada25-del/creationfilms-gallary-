<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ gallery.name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="gate">
  <div class="gate-card">
    {% if cover_url %}<div style="margin:-8px -8px 22px;aspect-ratio:4/3;overflow:hidden;border-radius:10px;background:#eadbd2"><img src="{{ cover_url }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block" onerror="this.parentNode.style.display='none'"></div>{% endif %}
    <div class="display">{{ gallery.name }}</div>
    <p class="sub">This gallery is private. Enter the password your photographer shared with you.</p>
    {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
    <form class="gate-form" method="post">
      <input type="password" name="password" placeholder="Gallery password" autofocus required>
      <button class="btn" type="submit">View gallery</button>
    </form>
  </div>
</div>
</body>
</html>
