<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ gallery.name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
.hero {
  position: relative;
  width: 100%;
  height: 62vh;
  min-height: 320px;
  max-height: 640px;
  overflow: hidden;
  background: var(--canvas-raised);
}
.hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(20,16,10,0.55) 0%, rgba(20,16,10,0.05) 45%, transparent 70%);
}
.hero-caption {
  position: absolute;
  left: 6vw;
  bottom: 28px;
  z-index: 2;
}
.hero-caption .display {
  color: #fdfaf4;
  font-size: clamp(2.2rem, 6vw, 3.6rem);
  font-style: italic;
  text-shadow: 0 2px 20px rgba(0,0,0,0.25);
}
.hero-caption .count {
  color: #f0e9da;
  font-size: 0.85rem;
  letter-spacing: 0.04em;
  margin-top: 6px;
  display: block;
}
.icon-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 6vw;
  border-bottom: 1px solid var(--line);
  background: var(--canvas);
}
.icon-bar .icon-group {
  display: flex;
  gap: 18px;
}
.icon-bar button {
  background: none;
  border: none;
  color: var(--muted);
  font-size: 1.1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'Jost', sans-serif;
  font-size: 0.85rem;
  letter-spacing: 0.02em;
}
.icon-bar button:hover { color: var(--brass); }
.icon-bar .toast {
  font-size: 0.8rem;
  color: var(--brass);
}
.masonry {
  padding: 24px 6vw 64px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-auto-rows: 8px;
  align-items: start;
  gap: 8px;
}
@media (min-width: 700px) { .masonry { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1100px) { .masonry { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.masonry .tile { position: relative; overflow: hidden; display: block; min-width: 0; background: var(--canvas-raised); }
.masonry .tile img { width: 100%; height: auto; display: block; object-fit: contain; }
.album-heading { grid-column: 1 / -1; padding: 18px 2px 4px; font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.55rem; font-style: italic; color: var(--ink); }
.sort-control { display:flex; align-items:center; gap:8px; margin-left:auto; }
.sort-control label { color:var(--muted); font-size:.78rem; }
.sort-control select { border:1px solid var(--line); background:var(--canvas); color:var(--ink); padding:8px 10px; font-family:'Jost',sans-serif; border-radius:2px; }
@media(max-width:600px){ .sort-control label { display:none; } .sort-control select { max-width:155px; } }
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.75);color:var(--ink);font-size:30px;line-height:42px;text-align:center;cursor:pointer;z-index:20;user-select:none;-webkit-tap-highlight-color:transparent}
.lb-nav:hover{background:#fff;border-color:var(--brass);color:var(--brass)}
.lb-prev{left:18px}.lb-next{right:18px}
#lbImage{
  touch-action:pan-y;
  user-select:none;
  -webkit-user-drag:none;
  will-change:transform,opacity;
}
.lb-counter{
  position:absolute;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  color:var(--ink);
  background:rgba(255,255,255,.8);
  border:1px solid var(--line);
  border-radius:20px;
  padding:7px 13px;
  font-size:13px;
  z-index:20;
  letter-spacing:.3px;
}
.lb-swipe-left{animation:lbSwipeLeft .18s ease-out}
.lb-swipe-right{animation:lbSwipeRight .18s ease-out}
@keyframes lbSwipeLeft{
  from{opacity:.45;transform:translateX(24px)}
  to{opacity:1;transform:translateX(0)}
}
@keyframes lbSwipeRight{
  from{opacity:.45;transform:translateX(-24px)}
  to{opacity:1;transform:translateX(0)}
}
@media(max-width:600px){.lb-nav{width:40px;height:40px;font-size:26px;line-height:36px}.lb-prev{left:10px}.lb-next{right:10px}}

 .hero-loading {
  position:absolute; inset:0; z-index:3; display:flex; align-items:center; justify-content:center;
  background:rgba(20,16,10,.18); transition:opacity .2s ease, visibility .2s ease;
}
.hero-loading.hidden { opacity:0; visibility:hidden; pointer-events:none; }
.hero-loading-box { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:999px;
  background:rgba(255,255,255,.82); color:var(--ink); font-size:.82rem; backdrop-filter:blur(6px); }
.hero-spinner { width:18px; height:18px; border:2px solid var(--line); border-top-color:var(--brass);
  border-radius:50%; animation:gallerySpin .75s linear infinite; }
@keyframes gallerySpin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="hero" id="hero">
  <img id="heroImage" src="" alt="">
  <div class="hero-loading" id="heroLoading" aria-live="polite"><div class="hero-loading-box"><span class="hero-spinner"></span><span>Loading cover photo…</span></div></div>
  <div class="hero-caption">
    <div class="display">{{ gallery.name }}</div>
    <span class="count" id="countLabel">{{ gallery.photos|length }} photos</span>
  </div>
</div>

<div class="icon-bar">
  <div class="icon-group">
    <button onclick="shareGallery()">&#128279; Share</button>
    <button onclick="startSlideshow()">&#9654; Slideshow</button>
    <button onclick="downloadAll()">&#8681; Download all</button>
  </div>
  <span class="toast" id="toast"></span>
</div>

<div class="toolbar" id="toolbar">
  <button class="active" data-filter="all" onclick="setFilter('all')">All</button>
  <button data-filter="favorites" onclick="setFilter('favorites')">Favorites</button>
  <div class="sort-control"><label for="sortSelect">Sort</label><select id="sortSelect" onchange="setSort(this.value)">
    <option value="order">Upload order</option><option value="taken_desc">Date taken · newest</option><option value="taken_asc">Date taken · oldest</option>
    <option value="name_asc">File name · A–Z</option><option value="name_desc">File name · Z–A</option><option value="ext_asc">Extension · A–Z</option><option value="ext_desc">Extension · Z–A</option>
  </select></div>
</div>

<div class="masonry photo-order-grid" id="grid"></div>
<div class="empty-state" id="emptyState" style="display:none;">No photos yet — check back soon.</div>

<div class="lightbox" id="lightbox">
  <button class="close" onclick="closeLightbox()">&times;</button>
  <div class="lb-counter" id="lbCounter">1 / 1</div>
  <button class="lb-nav lb-prev" id="lbPrev" onclick="previousPhoto()" aria-label="Previous photo">&#8249;</button>
  <img id="lbImage" src="" alt="">
  <button class="lb-nav lb-next" id="lbNext" onclick="nextPhoto()" aria-label="Next photo">&#8250;</button>
  <div class="lb-bar">
    <button class="btn btn-outline" id="lbFav" style="width:auto; padding:10px 20px;" onclick="toggleFavCurrent()">Favorite</button>
    <a class="btn" id="lbDownload" style="width:auto; padding:10px 20px;" href="#">Download</a>
  </div>
</div>

<script>
const slug = {{ slug|tojson }};
let photos = [];
let filter = 'all';
let sortMode = 'order';
let currentIndex = 0;

function hideGalleryLoader() {
  document.getElementById('galleryLoader')?.classList.add('hidden');
}

async function waitForInitialImages() {
  const loaderText = document.getElementById('galleryLoaderText');
  const imgs = [...document.querySelectorAll('#grid img')].slice(0, 12);
  const hero = document.getElementById('heroImage');
  if (hero && hero.src) imgs.unshift(hero);
  if (!imgs.length) return;
  loaderText.textContent = 'Loading photos…';
  await Promise.allSettled(imgs.map(img => new Promise(resolve => {
    if (img.complete) return resolve();
    img.addEventListener('load', resolve, { once: true });
    img.addEventListener('error', resolve, { once: true });
  })));
}

async function load() {
  try {
    const res = await fetch(`/api/gallery/${slug}/photos`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`Gallery load failed (${res.status})`);
    const data = await res.json();
    photos = data.photos || [];
    setHeroImage(data.cover_photo_id);
    buildToolbar();
    render();
  } catch (err) {
    document.getElementById('heroLoading')?.classList.add('hidden');
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('emptyState').textContent = 'Could not load photos. Please refresh.';
  }
}

function setHeroImage(coverId) {
  const hero = document.getElementById('heroImage');
  const loading = document.getElementById('heroLoading');
  if (!photos.length) { loading?.classList.add('hidden'); return; }
  const cover = coverId ? photos.find(p => p.id === coverId) : null;
  loading?.classList.remove('hidden');
  hero.onload = () => loading?.classList.add('hidden');
  hero.onerror = () => loading?.classList.add('hidden');
  hero.src = (cover || photos[0]).thumb_url;
  if (hero.complete) loading?.classList.add('hidden');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  setTimeout(() => { if (t.textContent === msg) t.textContent = ''; }, 2500);
}

function shareGallery() {
  const url = window.location.href;
  if (navigator.share) {
    navigator.share({ title: document.title, url }).catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => showToast('Link copied'));
  }
}

let slideshowTimer = null;
function startSlideshow() {
  const list = visiblePhotos();
  if (!list.length) return;
  openLightbox(list[0].id);
  clearInterval(slideshowTimer);
  slideshowTimer = setInterval(() => nextPhoto(), 3000);
}

function downloadAll() {
  const list = visiblePhotos();
  if (!list.length) return;
  showToast(`Starting ${list.length} downloads...`);
  list.forEach((p, i) => {
    setTimeout(() => {
      const a = document.createElement('a');
      a.href = p.download_url || `/gallery/${slug}/photo/${p.id}/download`;
      a.download = '';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }, i * 400);
  });
}

function buildToolbar() {
  const toolbar = document.getElementById('toolbar');
  const categories = [];
  photos.forEach(p => { const c=(p.category||'').trim(); if(c && !categories.includes(c)) categories.push(c); });
  categories.forEach(c => { const b=document.createElement('button'); b.dataset.filter=c; b.textContent=c; b.onclick=()=>setFilter(c); toolbar.insertBefore(b, document.querySelector('.sort-control')); });
}
function setSort(mode){ sortMode=mode||'order'; render(); }
function sortedPhotos(list){
  const arr=[...list], name=p=>String(p.filename||'').toLowerCase(), ext=p=>{const n=name(p),i=n.lastIndexOf('.');return i>=0?n.slice(i+1):''}, taken=p=>p.taken_at?new Date(p.taken_at).getTime():0;
  if(sortMode==='taken_desc') return arr.sort((a,b)=>(taken(b)-taken(a))||name(a).localeCompare(name(b),undefined,{numeric:true}));
  if(sortMode==='taken_asc') return arr.sort((a,b)=>(taken(a)-taken(b))||name(a).localeCompare(name(b),undefined,{numeric:true}));
  if(sortMode==='name_asc') return arr.sort((a,b)=>name(a).localeCompare(name(b),undefined,{numeric:true}));
  if(sortMode==='name_desc') return arr.sort((a,b)=>name(b).localeCompare(name(a),undefined,{numeric:true}));
  if(sortMode==='ext_asc') return arr.sort((a,b)=>(ext(a).localeCompare(ext(b)))||name(a).localeCompare(name(b),undefined,{numeric:true}));
  if(sortMode==='ext_desc') return arr.sort((a,b)=>(ext(b).localeCompare(ext(a)))||name(a).localeCompare(name(b),undefined,{numeric:true}));
  return arr;
}
function visiblePhotos(){
  let list=filter==='favorites'?photos.filter(p=>p.favorite):(filter==='all'?photos:photos.filter(p=>p.category===filter));
  return sortedPhotos(list);
}
function tileSpan(tile,img){
  const grid=document.getElementById('grid'), styles=getComputedStyle(grid), row=parseFloat(styles.gridAutoRows)||8, gap=parseFloat(styles.rowGap)||8;
  const ratio=(img.naturalWidth&&img.naturalHeight)?img.naturalHeight/img.naturalWidth:1, width=tile.getBoundingClientRect().width, height=Math.max(40,width*ratio);
  tile.style.gridRowEnd=`span ${Math.max(1,Math.ceil((height+gap)/(row+gap)))}`;
}
function renderTile(p,i){
  const tile=document.createElement('div'); tile.className='tile'; tile.dataset.id=p.id; tile.onclick=()=>openLightbox(p.id);
  const img=document.createElement('img'); img.src=p.thumb_url; img.loading=i<12?'eager':'lazy'; img.fetchPriority=i<6?'high':'auto'; img.decoding='async'; img.alt=''; img.onload=()=>tileSpan(tile,img); tile.appendChild(img);
  const fav=document.createElement('div'); fav.className=`fav ${p.favorite?'active':''}`; fav.innerHTML='&#9825;'; fav.onclick=e=>{e.stopPropagation();toggleFav(p.id)}; tile.appendChild(fav); return tile;
}
function render(){
  const grid=document.getElementById('grid'), list=visiblePhotos(); grid.innerHTML=''; document.getElementById('emptyState').style.display=list.length?'none':'block'; document.getElementById('countLabel').textContent=`${photos.length} photos`;
  if(filter==='all'){
    const groups=[], map=new Map(); list.forEach(p=>{const c=(p.category||'').trim()||'Other'; if(!map.has(c)){map.set(c,[]);groups.push(c)} map.get(c).push(p)});
    groups.forEach(cat=>{const head=document.createElement('div');head.className='album-heading';head.textContent=cat;grid.appendChild(head);map.get(cat).forEach((p,i)=>grid.appendChild(renderTile(p,i)))});
  } else list.forEach((p,i)=>grid.appendChild(renderTile(p,i)));
}

function setFilter(f) {
  filter = f;
  document.querySelectorAll('#toolbar button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === f);
  });
  render();
}
async function toggleFav(id) {
  const res = await fetch(`/api/gallery/${slug}/photo/${id}/favorite`, { method: 'POST' });
  const data = await res.json();
  const p = photos.find(p => p.id === id);
  if (p) p.favorite = data.favorite;
  render();
  if (document.getElementById('lightbox').classList.contains('open')) {
    updateLightboxFavButton();
  }
}

function toggleFavCurrent() {
  const list = visiblePhotos();
  const p = list[currentIndex];
  if (p) toggleFav(p.id);
}

function openLightbox(id) {
  const list = visiblePhotos();
  currentIndex = list.findIndex(p => p.id === id);
  showCurrent();
  document.getElementById('lightbox').classList.add('open');
}

function showCurrent(direction = '') {
  const list = visiblePhotos();
  if (!list.length) return;
  if (currentIndex < 0) currentIndex = list.length - 1;
  if (currentIndex >= list.length) currentIndex = 0;

  const p = list[currentIndex];
  if (!p) return;

  const img = document.getElementById('lbImage');
  img.classList.remove('lb-swipe-left', 'lb-swipe-right');
  void img.offsetWidth; // restart animation
  if (direction === 'next') img.classList.add('lb-swipe-left');
  if (direction === 'previous') img.classList.add('lb-swipe-right');

  img.src = p.preview_url;
  document.getElementById('lbDownload').href = p.download_url || `/gallery/${slug}/photo/${p.id}/download`;
  document.getElementById('lbCounter').textContent = `${currentIndex + 1} / ${list.length}`;
  updateLightboxFavButton();
  updateNavButtons();

  // Preload adjacent compressed previews so next/previous feels instant.
  [list[(currentIndex + 1) % list.length], list[(currentIndex - 1 + list.length) % list.length]]
    .filter(Boolean)
    .forEach(next => { const pre = new Image(); pre.src = next.preview_url; });
}

function nextPhoto() {
  const list = visiblePhotos();
  if (!list.length) return;
  currentIndex = (currentIndex + 1) % list.length;
  showCurrent('next');
}

function previousPhoto() {
  const list = visiblePhotos();
  if (!list.length) return;
  currentIndex = (currentIndex - 1 + list.length) % list.length;
  showCurrent('previous');
}

function updateNavButtons() {
  const list = visiblePhotos();
  const hidden = list.length <= 1;
  document.getElementById('lbPrev').style.display = hidden ? 'none' : 'block';
  document.getElementById('lbNext').style.display = hidden ? 'none' : 'block';
}

function updateLightboxFavButton() {
  const list = visiblePhotos();
  const p = list[currentIndex];
  document.getElementById('lbFav').textContent = p && p.favorite ? 'Favorited ✓' : 'Favorite';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  clearInterval(slideshowTimer);
}

document.addEventListener('keydown', (e) => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') previousPhoto();
  if (e.key === 'ArrowRight') nextPhoto();
});

let touchStartX = 0;
let touchStartY = 0;

const lbImage = document.getElementById('lbImage');

lbImage.addEventListener('touchstart', (e) => {
  if (!e.touches.length) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

lbImage.addEventListener('touchend', (e) => {
  if (!e.changedTouches.length) return;

  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;

  if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;

  if (dx < 0) nextPhoto();
  else previousPhoto();
}, { passive: true });

load();
</script>
</body>
  </html>
