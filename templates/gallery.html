<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ gallery.name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
.hero {
  position: relative;
  width: 100%;
  height: 62vh;
  min-height: 320px;
  max-height: 640px;
  overflow: hidden;
  background: var(--canvas-raised);
}
.hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(20,16,10,0.55) 0%, rgba(20,16,10,0.05) 45%, transparent 70%);
}
.hero-caption {
  position: absolute;
  left: 6vw;
  bottom: 28px;
  z-index: 2;
}
.hero-caption {
  left: 0; right: 0;
  bottom: 44px;
  text-align: center;
}
.hero-caption .display {
  color: #fdfaf4;
  font-size: clamp(2.4rem, 7vw, 4.2rem);
  font-style: italic;
  text-shadow: 0 2px 20px rgba(0,0,0,0.25);
}
.hero-caption .count {
  color: #f0e9da;
  font-size: 0.72rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  margin-top: 12px;
  display: block;
}
.icon-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 6vw;
  border-bottom: 1px solid var(--line);
  background: var(--canvas);
}
.icon-bar .icon-group {
  display: flex;
  gap: 18px;
}
.icon-bar button {
  background: none;
  border: none;
  color: var(--muted);
  font-size: 1.1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'Jost', sans-serif;
  font-size: 0.85rem;
  letter-spacing: 0.02em;
}
.icon-bar button:hover { color: var(--brass); }
.icon-bar .toast {
  font-size: 0.8rem;
  color: var(--brass);
}
.fav-header {
  position: sticky;
  top: 0;
  z-index: 15;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 6vw;
  background: rgba(247,242,234,0.92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.fav-header-back {
  background: none; border: none; color: var(--muted); cursor: pointer;
  font-family: 'Jost', sans-serif; font-size: 0.85rem; letter-spacing: 0.02em;
  display: flex; align-items: center; gap: 4px;
}
.fav-header-back:hover { color: var(--brass); }
.fav-header-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1.3rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.fav-header-actions { display: flex; align-items: center; gap: 14px; }
.fav-header-count { color: var(--muted); font-size: 0.82rem; }
.fav-header-download {
  background: var(--brass); color: #fdfaf4; border: none;
  padding: 9px 16px; border-radius: 20px; font-size: 0.75rem;
  letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer;
  font-family: 'Jost', sans-serif;
}
.fav-header-download:hover { background: #75492a; }
@media (max-width: 520px) {
  .fav-header-title { order: 3; width: 100%; text-align: center; }
}
.masonry {
  padding: 24px 6vw 64px;
  display: flex;
  align-items: flex-start;
  gap: 0 8px;
}
.masonry-column {
  min-width: 0;
  flex: 1 1 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.masonry .tile {
  position: relative;
  aspect-ratio: auto;
  min-height: 90px; /* keeps the tile visible/tappable while its image is still downloading */
  overflow: hidden;
  display: block;
  background: var(--canvas-raised);
  border-radius: 3px;
}
.masonry .tile img {
  width: 100%;
  height: auto;
  min-height: 90px;
  display: block;
  object-fit: unset;
  transition: transform .4s ease;
}
.masonry .tile::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0);
  transition: background .25s ease;
  pointer-events: none;
}
.masonry .tile:hover::after { background: rgba(0,0,0,0.12); }
.masonry .tile:hover img { transform: scale(1.03); }
.masonry .tile-loading {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,.55);
  z-index: 2;
  transition: opacity .2s ease, visibility .2s ease;
}
.masonry .tile-loading.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.tile-spinner {
  width: 22px;
  height: 22px;
  border: 2px solid var(--line);
  border-top-color: var(--brass);
  border-radius: 50%;
  animation: gallerySpin .75s linear infinite;
}
/* ---------- Lightbox: restyled to a full dark theme, icon top-bar ---------- */
.lightbox {
  background: #0b0b0b !important;
}
.lb-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 16px 20px;
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 21;
  color: #fdfaf4;
}
.lb-topbar .lb-counter-text { font-size: 0.82rem; opacity: 0.75; letter-spacing: 0.03em; }
.lb-topbar .lb-icons { display: flex; align-items: center; gap: 6px; }
.lb-icon-btn {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: none; color: #fdfaf4;
  border-radius: 50%; cursor: pointer; font-size: 1.25rem;
  -webkit-tap-highlight-color: transparent;
}
.lb-icon-btn:hover { background: rgba(255,255,255,0.12); }
.lb-icon-btn.active { color: var(--brass); }
.lightbox img { box-shadow: none; }
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border:none;border-radius:50%;background:rgba(255,255,255,.08);color:#fdfaf4;font-size:30px;line-height:42px;text-align:center;cursor:pointer;z-index:20;user-select:none;-webkit-tap-highlight-color:transparent}
.lb-nav:hover{background:rgba(255,255,255,.18)}
.lb-prev{left:18px}.lb-next{right:18px}
#lbImage{
  touch-action:pan-y;
  user-select:none;
  -webkit-user-drag:none;
  will-change:transform,opacity;
  min-height: 80px;
}
.lb-loading {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 25;
  transition: opacity .2s ease, visibility .2s ease;
}
.lb-loading.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.lb-loading .tile-spinner {
  width: 30px;
  height: 30px;
  background: rgba(255,255,255,.75);
  padding: 10px;
  box-sizing: content-box;
  border-radius: 50%;
}
.lb-swipe-left{animation:lbSwipeLeft .18s ease-out}
.lb-swipe-right{animation:lbSwipeRight .18s ease-out}
@keyframes lbSwipeLeft{
  from{opacity:.45;transform:translateX(24px)}
  to{opacity:1;transform:translateX(0)}
}
@keyframes lbSwipeRight{
  from{opacity:.45;transform:translateX(-24px)}
  to{opacity:1;transform:translateX(0)}
}
@media(max-width:600px){.lb-nav{width:40px;height:40px;font-size:26px;line-height:36px}.lb-prev{left:10px}.lb-next{right:10px}}

 .hero-loading {
  position:absolute; inset:0; z-index:3; display:flex; align-items:center; justify-content:center;
  background:rgba(20,16,10,.18); transition:opacity .2s ease, visibility .2s ease;
}
.hero-loading.hidden { opacity:0; visibility:hidden; pointer-events:none; }
.hero-loading-box { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:999px;
  background:rgba(255,255,255,.82); color:var(--ink); font-size:.82rem; backdrop-filter:blur(6px); }
.hero-spinner { width:18px; height:18px; border:2px solid var(--line); border-top-color:var(--brass);
  border-radius:50%; animation:gallerySpin .75s linear infinite; }
@keyframes gallerySpin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="hero" id="hero">
  <img id="heroImage" src="" alt="">
  <div class="hero-loading" id="heroLoading" aria-live="polite"><div class="hero-loading-box"><span class="hero-spinner"></span><span>Loading cover photo…</span></div></div>
  <div class="hero-caption">
    <div class="display">{{ gallery.name }}</div>
    <span class="count" id="countLabel">{{ gallery.photos|length }} photos</span>
  </div>
</div>

<div class="icon-bar" id="iconBar">
  <div class="icon-group">
    <button onclick="shareGallery()">&#128279; Share</button>
    <button onclick="startSlideshow()">&#9654; Slideshow</button>
    <button onclick="downloadAll()">&#8681; Download all</button>
  </div>
  <span class="toast" id="toast"></span>
</div>

<div class="toolbar" id="toolbar">
  <button class="active" data-filter="all" onclick="setFilter('all')">All</button>
  <button data-filter="favorites" onclick="setFilter('favorites')">Favorites</button>
</div>

<div class="fav-header" id="favHeader" style="display:none;">
  <button class="fav-header-back" onclick="setFilter('all')">&#8249; Back</button>
  <div class="fav-header-title">My Favourites</div>
  <div class="fav-header-actions">
    <span class="fav-header-count" id="favHeaderCount">0 Photos</span>
    <button class="fav-header-download" onclick="downloadAll()">Download Favourites</button>
  </div>
</div>

<div class="masonry photo-order-grid" id="grid"></div>
<div class="empty-state" id="emptyState" style="display:none;">No photos yet — check back soon.</div>

<div class="lightbox" id="lightbox">
  <div class="lb-topbar">
    <span class="lb-counter-text" id="lbCounter">1 / 1</span>
    <div class="lb-icons">
      <button class="lb-icon-btn" id="lbFav" onclick="toggleFavCurrent()" aria-label="Favorite">&#9825;</button>
      <a class="lb-icon-btn" id="lbDownload" href="#" aria-label="Download" style="text-decoration:none;">&#8681;</a>
      <button class="lb-icon-btn" onclick="closeLightbox()" aria-label="Close" style="margin-left:6px;">&times;</button>
    </div>
  </div>
  <button class="lb-nav lb-prev" id="lbPrev" onclick="previousPhoto()" aria-label="Previous photo">&#8249;</button>
  <img id="lbImage" src="" alt="">
  <div class="lb-loading hidden" id="lbLoading" aria-live="polite"><span class="tile-spinner"></span></div>
  <button class="lb-nav lb-next" id="lbNext" onclick="nextPhoto()" aria-label="Next photo">&#8250;</button>
</div>

<script>
const slug = {{ slug|tojson }};
let photos = [];
let filter = 'all';
let currentIndex = 0;

function hideGalleryLoader() {
  document.getElementById('galleryLoader')?.classList.add('hidden');
}

async function waitForInitialImages() {
  const loaderText = document.getElementById('galleryLoaderText');
  const imgs = [...document.querySelectorAll('#grid img')].slice(0, 12);
  const hero = document.getElementById('heroImage');
  if (hero && hero.src) imgs.unshift(hero);
  if (!imgs.length) return;
  loaderText.textContent = 'Loading photos…';
  await Promise.allSettled(imgs.map(img => new Promise(resolve => {
    if (img.complete) return resolve();
    img.addEventListener('load', resolve, { once: true });
    img.addEventListener('error', resolve, { once: true });
  })));
}

async function load() {
  try {
    const res = await fetch(`/api/gallery/${slug}/photos`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`Gallery load failed (${res.status})`);
    const data = await res.json();
    photos = data.photos || [];
    setHeroImage(data.cover_photo_id);
    buildToolbar();
    render();
  } catch (err) {
    document.getElementById('heroLoading')?.classList.add('hidden');
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('emptyState').textContent = 'Could not load photos. Please refresh.';
  }
}

function setHeroImage(coverId) {
  const hero = document.getElementById('heroImage');
  const loading = document.getElementById('heroLoading');
  if (!photos.length) { loading?.classList.add('hidden'); return; }
  const cover = coverId ? photos.find(p => p.id === coverId) : null;
  loading?.classList.remove('hidden');
  hero.onload = () => loading?.classList.add('hidden');
  hero.onerror = () => loading?.classList.add('hidden');
  hero.src = (cover || photos[0]).thumb_url;
  if (hero.complete) loading?.classList.add('hidden');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  setTimeout(() => { if (t.textContent === msg) t.textContent = ''; }, 2500);
}

function shareGallery() {
  const url = window.location.href;
  if (navigator.share) {
    navigator.share({ title: document.title, url }).catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => showToast('Link copied'));
  }
}

let slideshowTimer = null;
function startSlideshow() {
  const list = visiblePhotos();
  if (!list.length) return;
  openLightbox(list[0].id);
  clearInterval(slideshowTimer);
  slideshowTimer = setInterval(() => nextPhoto(), 3000);
}

function downloadAll() {
  const list = visiblePhotos();
  if (!list.length) return;
  showToast(`Starting ${list.length} downloads...`);
  list.forEach((p, i) => {
    setTimeout(() => {
      const a = document.createElement('a');
      a.href = p.download_url || `/gallery/${slug}/photo/${p.id}/download`;
      a.download = '';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }, i * 400);
  });
}

function buildToolbar() {
  const toolbar = document.getElementById('toolbar');
  const categories = [...new Set(photos.map(p => p.category).filter(c => c))].sort();
  if (!categories.length) return;
  const extra = categories.map(c => `<button data-filter="${c}" onclick="setFilter('${c}')">${c}</button>`).join('');
  toolbar.insertAdjacentHTML('beforeend', extra);
}

function visiblePhotos() {
  if (filter === 'favorites') return photos.filter(p => p.favorite);
  if (filter === 'all') return photos;
  return photos.filter(p => p.category === filter);
}

function getColumnCount() {
  const w = window.innerWidth;
  if (w >= 1100) return 4;
  if (w >= 700) return 3;
  return 2;
}

function render() {
  const grid = document.getElementById('grid');
  const list = visiblePhotos();
  document.getElementById('emptyState').style.display = list.length ? 'none' : 'block';
  document.getElementById('countLabel').textContent = `${photos.length} photos`;

  // Build independent columns in JS (instead of relying on CSS Grid's
  // row-based auto-placement) so a short photo next to a tall one doesn't
  // leave a blank gap — each column just stacks its own photos tightly.
  const columnCount = getColumnCount();
  const columns = Array.from({ length: columnCount }, () => []);
  list.forEach((p, i) => columns[i % columnCount].push({ p, i }));

  grid.innerHTML = columns.map(col => `
    <div class="masonry-column">
      ${col.map(({ p, i }) => `
        <div class="tile" data-id="${p.id}" onclick="openLightbox('${p.id}')">
          <div class="tile-loading" aria-hidden="true"><span class="tile-spinner"></span></div>
          <img src="${p.thumb_url}" data-src="${p.thumb_url}"
               loading="${i < 6 ? 'eager' : 'lazy'}"
               fetchpriority="${i < 4 ? 'high' : 'auto'}"
               decoding="async" alt="">
          <div class="fav ${p.favorite ? 'active' : ''}" onclick="event.stopPropagation(); toggleFav('${p.id}')">&#9825;</div>
        </div>
      `).join('')}
    </div>
  `).join('');

  // Thumbnails are small pre-generated files, but on a flaky connection a
  // request can still fail outright — retry a few times instead of leaving
  // the tile permanently blank and un-tappable.
  grid.querySelectorAll('.tile').forEach(tile => {
    const img = tile.querySelector('img');
    const spinner = tile.querySelector('.tile-loading');
    const finish = () => spinner.classList.add('hidden');
    let attempts = 0;
    const retry = () => {
      attempts += 1;
      if (attempts > 3) { finish(); return; }
      setTimeout(() => {
        img.src = `${img.dataset.src}${img.dataset.src.includes('?') ? '&' : '?'}retry=${attempts}`;
      }, attempts * 700);
    };
    img.addEventListener('load', finish);
    img.addEventListener('error', retry);
    if (img.complete && img.naturalWidth > 0) finish();
  });
}

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (getColumnCount() !== document.querySelectorAll('.masonry-column').length) render();
  }, 200);
});

function setFilter(f) {
  filter = f;
  document.querySelectorAll('#toolbar button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === f);
  });

  const isFav = f === 'favorites';
  document.getElementById('favHeader').style.display = isFav ? 'flex' : 'none';
  document.getElementById('iconBar').style.display = isFav ? 'none' : 'flex';
  document.getElementById('toolbar').style.display = isFav ? 'none' : 'flex';
  if (isFav) {
    const count = photos.filter(p => p.favorite).length;
    document.getElementById('favHeaderCount').textContent = `${count} Photo${count === 1 ? '' : 's'}`;
  }

  render();
}

async function toggleFav(id) {
  const res = await fetch(`/api/gallery/${slug}/photo/${id}/favorite`, { method: 'POST' });
  const data = await res.json();
  const p = photos.find(p => p.id === id);
  if (p) p.favorite = data.favorite;
  render();
  if (filter === 'favorites') {
    const count = photos.filter(p => p.favorite).length;
    document.getElementById('favHeaderCount').textContent = `${count} Photo${count === 1 ? '' : 's'}`;
  }
  if (document.getElementById('lightbox').classList.contains('open')) {
    updateLightboxFavButton();
  }
}

function toggleFavCurrent() {
  const list = visiblePhotos();
  const p = list[currentIndex];
  if (p) toggleFav(p.id);
}

function openLightbox(id) {
  const list = visiblePhotos();
  currentIndex = list.findIndex(p => p.id === id);
  showCurrent();
  document.getElementById('lightbox').classList.add('open');
}

function showCurrent(direction = '') {
  const list = visiblePhotos();
  if (!list.length) return;
  if (currentIndex < 0) currentIndex = list.length - 1;
  if (currentIndex >= list.length) currentIndex = 0;

  const p = list[currentIndex];
  if (!p) return;

  const img = document.getElementById('lbImage');
  const loading = document.getElementById('lbLoading');
  loading.classList.remove('hidden');
  loading.innerHTML = '<span class="tile-spinner"></span>';
  img.classList.remove('lb-swipe-left', 'lb-swipe-right');
  void img.offsetWidth; // restart animation
  if (direction === 'next') img.classList.add('lb-swipe-left');
  if (direction === 'previous') img.classList.add('lb-swipe-right');

  const requestedId = p.id;

  // Show the already-downloaded grid thumbnail immediately — it's instant —
  // then swap in the sharper preview once that finishes. The person always
  // sees *something* right away instead of a blank frozen-looking modal
  // while the bigger file comes from the server.
  img.onload = () => loading.classList.add('hidden');
  img.onerror = () => {};
  img.src = p.thumb_url;
  if (img.complete) loading.classList.add('hidden');

  let fullAttempts = 0;
  const tryFull = () => {
    const full = new Image();
    full.onload = () => {
      if (list[currentIndex] && list[currentIndex].id === requestedId) {
        img.src = full.src;
        loading.classList.add('hidden');
      }
    };
    full.onerror = () => {
      if (list[currentIndex] && list[currentIndex].id !== requestedId) return; // already moved on
      fullAttempts += 1;
      if (fullAttempts <= 4) { setTimeout(tryFull, fullAttempts * 900); return; }
      console.error('Preview failed to load after retries:', p.preview_url);
      loading.classList.remove('hidden');
      loading.innerHTML = '<span style="font-size:.8rem;text-align:center;padding:0 20px;background:rgba(255,255,255,.9);border-radius:8px;display:block;">Couldn\'t load full photo.<br><a href="#" onclick="showCurrent(); return false;" style="color:var(--brass);text-decoration:underline;">Tap to retry</a></span>';
    };
    full.src = `${p.preview_url}${fullAttempts ? (p.preview_url.includes('?') ? '&' : '?') + 'retry=' + fullAttempts : ''}`;
  };
  tryFull();

  document.getElementById('lbDownload').href = p.download_url || `/gallery/${slug}/photo/${p.id}/download`;
  document.getElementById('lbCounter').textContent = `${currentIndex + 1} / ${list.length}`;
  updateLightboxFavButton();
  updateNavButtons();

  // Preload adjacent compressed previews so next/previous feels instant.
  [list[(currentIndex + 1) % list.length], list[(currentIndex - 1 + list.length) % list.length]]
    .filter(Boolean)
    .forEach(next => { const pre = new Image(); pre.src = next.preview_url; });
}

function nextPhoto() {
  const list = visiblePhotos();
  if (!list.length) return;
  currentIndex = (currentIndex + 1) % list.length;
  showCurrent('next');
}

function previousPhoto() {
  const list = visiblePhotos();
  if (!list.length) return;
  currentIndex = (currentIndex - 1 + list.length) % list.length;
  showCurrent('previous');
}

function updateNavButtons() {
  const list = visiblePhotos();
  const hidden = list.length <= 1;
  document.getElementById('lbPrev').style.display = hidden ? 'none' : 'block';
  document.getElementById('lbNext').style.display = hidden ? 'none' : 'block';
}

function updateLightboxFavButton() {
  const list = visiblePhotos();
  const p = list[currentIndex];
  const btn = document.getElementById('lbFav');
  const active = !!(p && p.favorite);
  btn.classList.toggle('active', active);
  btn.innerHTML = active ? '&#9829;' : '&#9825;';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  clearInterval(slideshowTimer);
}

document.addEventListener('keydown', (e) => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') previousPhoto();
  if (e.key === 'ArrowRight') nextPhoto();
});

let touchStartX = 0;
let touchStartY = 0;

const lbImage = document.getElementById('lbImage');

lbImage.addEventListener('touchstart', (e) => {
  if (!e.touches.length) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

lbImage.addEventListener('touchend', (e) => {
  if (!e.changedTouches.length) return;

  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;

  if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;

  if (dx < 0) nextPhoto();
  else previousPhoto();
}, { passive: true });

load();
</script>
</body>
  </html>
