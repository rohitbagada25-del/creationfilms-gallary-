<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ gallery.name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border:1px solid rgba(255,255,255,.25);border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:30px;line-height:42px;text-align:center;cursor:pointer;z-index:20;user-select:none;-webkit-tap-highlight-color:transparent}
.lb-nav:hover{background:rgba(255,255,255,.18)}
.lb-prev{left:18px}.lb-next{right:18px}
#lbImage{
  touch-action:pan-y;
  user-select:none;
  -webkit-user-drag:none;
  will-change:transform,opacity;
}
.lb-counter{
  position:absolute;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  color:#fff;
  background:rgba(0,0,0,.5);
  border:1px solid rgba(255,255,255,.18);
  border-radius:20px;
  padding:7px 13px;
  font-size:13px;
  z-index:20;
  letter-spacing:.3px;
}
.lb-swipe-left{animation:lbSwipeLeft .18s ease-out}
.lb-swipe-right{animation:lbSwipeRight .18s ease-out}
@keyframes lbSwipeLeft{
  from{opacity:.45;transform:translateX(24px)}
  to{opacity:1;transform:translateX(0)}
}
@keyframes lbSwipeRight{
  from{opacity:.45;transform:translateX(-24px)}
  to{opacity:1;transform:translateX(0)}
}
@media(max-width:600px){.lb-nav{width:40px;height:40px;font-size:26px;line-height:36px}.lb-prev{left:10px}.lb-next{right:10px}}
</style>
</head>
<body>

<div class="gallery-header">
  <div class="display">{{ gallery.name }}</div>
  <div class="count" id="countLabel">{{ gallery.photos|length }} photos</div>
</div>

<div class="toolbar">
  <button class="active" id="viewAll" onclick="setFilter('all')">All</button>
  <button id="viewFavs" onclick="setFilter('favorites')">Favorites</button>
</div>

<div class="grid" id="grid"></div>
<div class="empty-state" id="emptyState" style="display:none;">No photos yet — check back soon.</div>

<div class="lightbox" id="lightbox">
  <button class="close" onclick="closeLightbox()">&times;</button>
  <div class="lb-counter" id="lbCounter">1 / 1</div>
  <button class="lb-nav lb-prev" id="lbPrev" onclick="previousPhoto()" aria-label="Previous photo">&#8249;</button>
  <img id="lbImage" src="" alt="">
  <button class="lb-nav lb-next" id="lbNext" onclick="nextPhoto()" aria-label="Next photo">&#8250;</button>
  <div class="lb-bar">
    <button class="btn btn-outline" id="lbFav" style="width:auto; padding:10px 20px;" onclick="toggleFavCurrent()">Favorite</button>
    <a class="btn" id="lbDownload" style="width:auto; padding:10px 20px;" href="#">Download</a>
  </div>
</div>

<script>
const slug = {{ slug|tojson }};
let photos = [];
let filter = 'all';
let currentIndex = 0;

async function load() {
  const res = await fetch(`/api/gallery/${slug}/photos`);
  const data = await res.json();
  photos = data.photos || [];
  render();
}

function visiblePhotos() {
  return filter === 'favorites' ? photos.filter(p => p.favorite) : photos;
}

function render() {
  const grid = document.getElementById('grid');
  const list = visiblePhotos();
  document.getElementById('emptyState').style.display = list.length ? 'none' : 'block';
  document.getElementById('countLabel').textContent = `${photos.length} photos`;

  grid.innerHTML = list.map((p, i) => `
    <div class="tile" data-id="${p.id}" onclick="openLightbox('${p.id}')">
      <img src="${p.thumb_url}" loading="lazy" alt="">
      <div class="fav ${p.favorite ? 'active' : ''}" onclick="event.stopPropagation(); toggleFav('${p.id}')">&#9825;</div>
    </div>
  `).join('');
}

function setFilter(f) {
  filter = f;
  document.getElementById('viewAll').classList.toggle('active', f === 'all');
  document.getElementById('viewFavs').classList.toggle('active', f === 'favorites');
  render();
}

async function toggleFav(id) {
  const res = await fetch(`/api/gallery/${slug}/photo/${id}/favorite`, { method: 'POST' });
  const data = await res.json();
  const p = photos.find(p => p.id === id);
  if (p) p.favorite = data.favorite;
  render();
  if (document.getElementById('lightbox').classList.contains('open')) {
    updateLightboxFavButton();
  }
}

function toggleFavCurrent() {
  const list = visiblePhotos();
  const p = list[currentIndex];
  if (p) toggleFav(p.id);
}

function openLightbox(id) {
  const list = visiblePhotos();
  currentIndex = list.findIndex(p => p.id === id);
  showCurrent();
  document.getElementById('lightbox').classList.add('open');
}

function showCurrent(direction = '') {
  const list = visiblePhotos();
  if (!list.length) return;
  if (currentIndex < 0) currentIndex = list.length - 1;
  if (currentIndex >= list.length) currentIndex = 0;

  const p = list[currentIndex];
  if (!p) return;

  const img = document.getElementById('lbImage');
  img.classList.remove('lb-swipe-left', 'lb-swipe-right');
  void img.offsetWidth; // restart animation
  if (direction === 'next') img.classList.add('lb-swipe-left');
  if (direction === 'previous') img.classList.add('lb-swipe-right');

  img.src = p.thumb_url;
  document.getElementById('lbDownload').href = `/gallery/${slug}/photo/${p.id}/download`;
  document.getElementById('lbCounter').textContent = `${currentIndex + 1} / ${list.length}`;
  updateLightboxFavButton();
  updateNavButtons();
}

function nextPhoto() {
  const list = visiblePhotos();
  if (!list.length) return;
  currentIndex = (currentIndex + 1) % list.length;
  showCurrent('next');
}

function previousPhoto() {
  const list = visiblePhotos();
  if (!list.length) return;
  currentIndex = (currentIndex - 1 + list.length) % list.length;
  showCurrent('previous');
}

function updateNavButtons() {
  const list = visiblePhotos();
  const hidden = list.length <= 1;
  document.getElementById('lbPrev').style.display = hidden ? 'none' : 'block';
  document.getElementById('lbNext').style.display = hidden ? 'none' : 'block';
}

function updateLightboxFavButton() {
  const list = visiblePhotos();
  const p = list[currentIndex];
  document.getElementById('lbFav').textContent = p && p.favorite ? 'Favorited ✓' : 'Favorite';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

document.addEventListener('keydown', (e) => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') previousPhoto();
  if (e.key === 'ArrowRight') nextPhoto();
});

let touchStartX = 0;
let touchStartY = 0;

const lbImage = document.getElementById('lbImage');

lbImage.addEventListener('touchstart', (e) => {
  if (!e.touches.length) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

lbImage.addEventListener('touchend', (e) => {
  if (!e.changedTouches.length) return;

  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;

  if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;

  if (dx < 0) nextPhoto();
  else previousPhoto();
}, { passive: true });

load();
</script>
</body>
  </html>
